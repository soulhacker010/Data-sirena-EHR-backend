databases:
  - name: sirena-ehr-db
    plan: basic-256mb
    databaseName: sirena_ehr
    user: sirena
    region: oregon
    postgresMajorVersion: "18"

services:
  - type: web
    name: sirena-ehr-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # Switched from gunicorn (WSGI only) to daphne (ASGI — handles both HTTP
    # and WebSocket). Daphne dispatches HTTP requests to the standard Django
    # app and routes /ws/* upgrades through Channels' ProtocolTypeRouter,
    # so the BLS module's real-time consumers work over the same port.
    # See config/asgi.py for the routing decision. Workers were 2 with
    # gunicorn — daphne uses one process with async I/O so concurrency is
    # bound by the event loop, not worker count.
    startCommand: daphne -b 0.0.0.0 -p $PORT --proxy-headers config.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: sirena-ehr-backend.onrender.com
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sirena-ehr-backend.onrender.com
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Comma-separated list of origins (with scheme) allowed to open
      # WebSockets. Must include every domain the frontend ships from.
      # Example: https://sirena-ehr.vercel.app,https://app.sirenahealth.com
      - key: WS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sirena-ehr-db
          property: connectionURI
      - key: DRF_THROTTLE_USER
        value: "200/min"
      - key: DRF_THROTTLE_ANON
        value: "50/min"
      - key: DRF_THROTTLE_LOGIN
        value: "5/min"
      - key: DRF_THROTTLE_EMAIL
        value: "10/min"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@sirenahealthehr.com
      - key: RESEND_REPLY_TO
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: REDIS_URL
        sync: false
      # Pin Channels to Redis in prod. Without this, a missing REDIS_URL
      # would silently drop to InMemoryChannelLayer, which can't share
      # group state across web instances — therapist and client sockets
      # routed to different processes would never see each other.
      - key: CHANNELS_BACKEND
        value: redis
      - key: PYTHON_VERSION
        value: "3.10.0"

  # Celery worker — processes background tasks (emails, claims, etc.)
  - type: worker
    name: sirena-ehr-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sirena-ehr-db
          property: connectionURI
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@sirenahealthehr.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: PYTHON_VERSION
        value: "3.10.0"
